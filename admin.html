<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>上帝视角 - 游戏控制台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #4361ee; --success: #2ecc71; --warning: #f39c12; --danger: #e74c3c; --dark: #2b2d42; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #e5e5e5; margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        button:hover { opacity: 0.9; }
        .btn-start { background-color: var(--success); font-size: 16px; }
        .btn-stage { background-color: var(--primary); }
        .btn-ent { background-color: #8e44ad; }
        .btn-end { background-color: var(--danger); width: 100%; margin-top: 15px; }
        .btn-download { background-color: #27ae60; width: 100%; margin-top: 15px; font-size: 1.1em; padding: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--light); }
        .room-code { font-size: 2em; color: var(--primary); letter-spacing: 2px; }
        .toggle-container { margin-top: 15px; background: #fff3cd; padding: 10px; border-radius: 8px; border-left: 5px solid var(--warning); display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🎮 游戏主控台 (六大习性版)</h2>
        <button class="btn-start" onclick="createRoom()">🚀 创建新房间</button>
        <h3 id="room-display" class="room-code">等待创建...</h3>
        
        <div id="controls" style="display:none;">
            <div class="toggle-container">
                <label style="font-weight: bold; cursor: pointer;">
                    <input type="checkbox" id="modeToggle" onchange="toggleMode()"> 
                    开启“自主选角”模式 (第二局使用)
                </label>
            </div>

            <h4 style="margin-top: 20px;">上半场推送</h4>
            <button class="btn-stage" onclick="pushStage('1')">第 1 关</button>
            <button class="btn-stage" onclick="pushStage('2')">第 2 关</button>
            <button class="btn-stage" onclick="pushStage('3')">第 3 关</button>
            <button class="btn-stage" onclick="pushStage('4')">第 4 关</button>
            
            <h4 style="margin-top: 20px;">中场娱乐 (不计分)</h4>
            <button class="btn-ent" onclick="pushStage('4.5')">4.5 盲点拷问</button>
            <button class="btn-ent" onclick="pushStage('4.8')">4.8 宵夜人设</button>
            <button class="btn-ent" onclick="pushStage('4.9')">4.9 上错菜 (打字)</button>
            <button class="btn-stage" style="background:var(--warning)" onclick="pushStage('leaderboard_partial')">📊 推送排行榜</button>

            <h4 style="margin-top: 20px;">下半场推送 (带锁)</h4>
            <button class="btn-stage" onclick="pushStage('5')">第 5 关</button>
            <button class="btn-stage" onclick="pushStage('6')">第 6 关</button>
            <button class="btn-stage" onclick="pushStage('7')">第 7 关</button>
            <button class="btn-stage" onclick="pushStage('8')">第 8 关</button>

            <h4 style="margin-top: 20px;">大结局推送</h4>
            <button class="btn-stage" style="background:#34495e;" onclick="pushStage('9')">第 9 关</button>
            <button class="btn-stage" style="background:#34495e;" onclick="pushStage('10')">第 10 关</button>
            <button class="btn-end" onclick="pushStage('leaderboard_full')">🚨 第10关结束：全量大揭晓</button>

            <button class="btn-download" onclick="downloadHistory()">📥 下载全场游戏记录 (.txt)</button>
        </div>
    </div>

    <div>
        <div class="card" style="margin-bottom: 20px;">
            <h2>🏆 实时排行榜监控</h2>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>组别</th>
                        <th>角色</th>
                        <th>流量</th>
                        <th style="color:var(--danger)">慈心</th>
                        <th>觉察</th>
                        <th>包容</th>
                    </tr>
                </thead>
                <tbody id="teams-data">
                    <tr><td colspan="6">等待加入...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <!-- 标题改为动态ID，由JS接管 -->
            <h2 id="barrage-title" style="color: #8e44ad;">📡 实时作答弹幕 (等待下发)</h2>
            <div id="answers-data" style="background: #f1f2f6; padding: 15px; border-radius: 8px; min-height: 200px; max-height: 400px; overflow-y: auto; font-size: 1.1em; line-height: 1.6;">
                等待营员提交回答...
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjg66it1o-kDAMJHi8LnMIDenY0JLEL98",
      authDomain: "life-game-4a0da.firebaseapp.com",
      databaseURL: "https://life-game-4a0da-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "life-game-4a0da",
      storageBucket: "life-game-4a0da.firebasestorage.app",
      messagingSenderId: "538025029324",
      appId: "1:538025029324:web:a07d71ae5a02c727141c69"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let adminRoom = "";
    let currentAdminStage = null;
    let globalHistoryData = null;

    function createRoom() {
        adminRoom = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('room-display').innerText = `房间号: ${adminRoom}`;
        document.getElementById('controls').style.display = 'block';
        db.ref(`rooms/${adminRoom}/settings/manualSelect`).set(false);
        
        // 监听队伍分数
        db.ref(`rooms/${adminRoom}/teams`).on('value', snapshot => {
            let data = snapshot.val();
            if(!data) return;
            let tbody = document.getElementById('teams-data');
            tbody.innerHTML = '';
            let teamsArray = Object.keys(data).map(k => ({ name: k, ...data[k] }));
            teamsArray.sort((a, b) => b.reality - a.reality);
            
            teamsArray.forEach(team => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${team.name}</strong></td>
                    <td style="font-size:0.9em; color:#666;">${team.roleName.split(" ")[0]}</td>
                    <td style="color:var(--primary); font-weight:bold;">${team.reality}</td>
                    <td style="color:var(--danger); font-weight:bold;">${team.compassion}</td>
                    <td>${team.awareness}</td>
                    <td>${team.tolerance}</td>
                `;
                tbody.appendChild(tr);
            });
        });

        // 分开监听当前关卡号，实现刷新功能
        db.ref(`rooms/${adminRoom}/currentStage`).on('value', snapshot => {
            currentAdminStage = snapshot.val();
            renderBarrage();
        });

        // 监听整体历史记录变化
        db.ref(`rooms/${adminRoom}/history`).on('value', snapshot => {
            globalHistoryData = snapshot.val();
            renderBarrage();
        });
    }

    // 独立渲染弹幕的核心函数，任何关卡变化或新答案提交都会触发
    function renderBarrage() {
        let ansBox = document.getElementById('answers-data');
        let titleBox = document.getElementById('barrage-title');
        ansBox.innerHTML = '';

        if (!currentAdminStage) {
            titleBox.innerText = "📡 实时作答弹幕 (等待下发)";
            return;
        }

        if (currentAdminStage.includes("leaderboard")) {
            let text = currentAdminStage === "leaderboard_partial" ? "中场排行榜" : "终局大揭晓";
            titleBox.innerText = `📡 实时动态监控 (${text})`;
            ansBox.innerHTML = `<div style="text-align:center; color:#888; margin-top:20px;">正在展示大屏排行榜，无弹幕数据。</div>`;
            return;
        }

        // 动态修改区域标题
        titleBox.innerText = `📡 实时作答弹幕 (当前: 第 ${currentAdminStage} 关)`;

        if (!globalHistoryData) return;

        let safeStageId = currentAdminStage.toString().replace('.', '_');

        Object.keys(globalHistoryData).forEach(teamName => {
            let teamRecords = globalHistoryData[teamName];
            let currentRecord = teamRecords[`stage_${safeStageId}`];
            
            if(currentRecord) {
                let textNode = document.createElement('div');
                textNode.style.marginBottom = "10px";
                textNode.style.padding = "10px";
                textNode.style.background = "white";
                textNode.style.borderRadius = "5px";
                textNode.style.borderLeft = "4px solid #8e44ad";
                
                let displayAction = currentRecord.action;
                // 去除冗长前缀视觉效果
                if(displayAction.includes("：“")) displayAction = displayAction.split("：“")[1].replace("”", "");
                
                textNode.innerHTML = `<strong style="color:var(--primary)">[${teamName}]</strong> 选择了: <span style="color:#2c3e50;">${displayAction}</span>`;
                ansBox.appendChild(textNode);
            }
        });
    }

    function toggleMode() {
        let isManual = document.getElementById('modeToggle').checked;
        if(adminRoom) db.ref(`rooms/${adminRoom}/settings/manualSelect`).set(isManual);
    }

    function pushStage(stageId) {
        db.ref(`rooms/${adminRoom}`).update({ currentStage: stageId });
    }

    function downloadHistory() {
        if (!adminRoom) return alert("请先创建并运行一个房间！");
        
        db.ref(`rooms/${adminRoom}`).once('value').then(snap => {
            let data = snap.val();
            if (!data || !data.history) return alert("当前房间暂无队伍的选择记录可供下载！");

            let content = `======================================\n`;
            content += ` 慈心人生游戏 - 房间 [${adminRoom}] 完整记录\n`;
            content += ` 导出时间: ${new Date().toLocaleString()}\n`;
            content += `======================================\n\n`;

            let history = data.history;
            let teams = data.teams || {};

            Object.keys(history).forEach(teamName => {
                let role = teams[teamName] ? teams[teamName].roleName : "未知角色";
                let finalScore = teams[teamName] ? teams[teamName].reality : 0;
                let finalCompassion = teams[teamName] ? teams[teamName].compassion : 0;
                
                content += `【 队伍：${teamName} 】\n`;
                content += `* 扮演角色：${role}\n`;
                content += `* 最终流量：${finalScore}  |  最终慈心分：${finalCompassion}\n`;
                content += `--------------------------------------\n`;

                let teamRecords = history[teamName];
                
                let stages = Object.keys(teamRecords).sort((a, b) => {
                    let numA = parseFloat(a.replace('stage_', '').replace('_', '.'));
                    let numB = parseFloat(b.replace('stage_', '').replace('_', '.'));
                    return numA - numB;
                });

                stages.forEach(stageKey => {
                    let stageNum = stageKey.replace('stage_', '').replace('_', '.');
                    let record = teamRecords[stageKey];
                    let actionText = record.action;
                    
                    if (record.choiceId === "TEXT_INPUT") {
                        content += `[第 ${stageNum} 关] 输入了文本：\n => "${actionText}"\n\n`;
                    } else {
                        content += `[第 ${stageNum} 关] 选择了选项 ${record.choiceId}：\n => ${actionText}\n\n`;
                    }
                });
                
                content += `\n\n`;
            });

            let blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `游戏记录_房间${adminRoom}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    }
</script>
</body>
</html>
