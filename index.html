<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>慈心人生游戏</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="gameData.js"></script>
    <style>
        :root { --bg: #1a1a2e; --card: #16213e; --primary: #0f3460; --accent: #e94560; --text: #e0e0e0; --warning: #f39c12; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; }
        
        .card { position: relative; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 20px; }
        
        h2, h3 { color: white; margin-top: 0; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #333; border-radius: 8px; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 10px; background-color: var(--primary); color: white; font-size: 16px; font-weight: 500; text-align: left; transition: 0.2s; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); line-height: 1.5; }
        button:active { transform: scale(0.98); }
        button.btn-primary { background-color: var(--accent); text-align: center; font-weight: bold; }
        button:disabled { background-color: #2c2c38; color: #666; box-shadow: none; }
        .locked { border-left: 4px solid var(--accent); }
        .stat-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 16px; width: 85%; max-width: 400px; text-align: center; }
        .leaderboard-table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 15px; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .corner-lotus { 
            position: absolute; 
            top: 55%; 
            right: -80px; 
            transform: translateY(-50%); 
            z-index: 50; 
            pointer-events: none; 
        }
        
        @media (max-width: 720px) {
            .corner-lotus {
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                transform: none;
                margin-top: 25px; 
                display: flex;
                justify-content: flex-end; 
                padding-right: 15px; 
                opacity: 0.9;
            }
        }
        
        .lotus-petal { transform-origin: 50px 50px; transform: scale(0); animation: popPetal 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popPetal { to { transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="login-screen" class="card">
        <h2 style="text-align: center; margin-bottom: 30px;">慈心人生游戏 - M型网红</h2>
        <input type="text" id="roomCode" placeholder="输入4位房间号">
        <input type="text" id="teamName" placeholder="输入组别名称">
        <button class="btn-primary" onclick="joinRoom()">进入游戏</button>
    </div>

    <div id="game-screen" class="card" style="display:none;">
        <div class="stat-bar" id="my-stats" style="display:none;">
            <span style="width: 100%; margin-bottom: 5px;">被分配角色: <strong id="ui-role" style="color:var(--warning); font-size: 1.1em;"></strong></span>
            <span>觉察力: <strong id="ui-awareness"></strong></span>
            <span>包容力: <strong id="ui-tolerance"></strong></span>
            <span>流量: <strong id="ui-reality" style="color:#4ade80; font-size: 1.2em;">0</strong></span>
        </div>

        <h3 id="stage-title" style="color: var(--accent); font-size: 1.5em; margin-bottom: 15px; margin-top: 0;">等待开始...</h3>
        <p id="stage-desc" style="line-height: 1.6; color: #ddd; font-size: 1.2em; margin-bottom: 25px;"></p>
        
        <div id="options-container" style="margin-top: 15px;"></div>
        
        <div id="corner-lotus" class="corner-lotus"></div>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 style="color: var(--accent);">后果揭晓</h3>
        <p id="modal-text" style="line-height: 1.5; font-size: 1.1em;"></p>
        <p><strong>流量变动:</strong> <span id="modal-reality" style="font-size: 1.4em; font-weight: bold;"></span></p>
        <button class="btn-primary" onclick="document.getElementById('modal').style.display='none'" style="margin-top: 20px;">关闭等待下一关</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjg66it1o-kDAMJHi8LnMIDenY0JLEL98",
      authDomain: "life-game-4a0da.firebaseapp.com",
      databaseURL: "https://life-game-4a0da-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "life-game-4a0da",
      storageBucket: "life-game-4a0da.firebasestorage.app",
      messagingSenderId: "538025029324",
      appId: "1:538025029324:web:a07d71ae5a02c727141c69",
      measurementId: "G-07XZLZ2ZMD"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "";
    let myTeam = "";
    let myStats = { reality: 0, compassion: 0, awareness: 0, tolerance: 0, roleName: "" };

    function updateLotus(score) {
        const container = document.getElementById('corner-lotus');
        let petalCount = Math.floor(score / 10);
        
        if (petalCount <= 0) {
            container.innerHTML = ""; 
            return;
        }
        
        if (petalCount > 8) petalCount = 8; 

        let svg = `<svg viewBox="0 0 100 100" width="70" height="70" style="filter: drop-shadow(0 0 10px rgba(233, 69, 96, 0.4));">
            <defs>
                <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffb6c1" />
                    <stop offset="100%" stop-color="#e94560" />
                </linearGradient>
            </defs>`;
        
        const angles = [0, -45, 45, -90, 90, -135, 135, 180];
        
        for(let i = 0; i < petalCount; i++) {
            let angle = angles[i];
            svg += `
            <g transform="rotate(${angle} 50 50)">
                <path class="lotus-petal" style="animation-delay: ${i * 0.15}s;" d="M 50 50 C 30 30, 45 10, 50 5 C 55 10, 70 30, 50 50 Z" fill="url(#petalGrad)" stroke="#1a1a2e" stroke-width="1" />
            </g>`;
        }
        
        svg += `<circle cx="50" cy="50" r="4" fill="#f39c12" style="animation: popPetal 0.5s forwards; transform: scale(0); transform-origin: 50px 50px;" />`;
        svg += `</svg>`;
        
        container.innerHTML = svg;
    }

    function joinRoom() {
        currentRoom = document.getElementById('roomCode').value.toUpperCase();
        myTeam = document.getElementById('teamName').value.trim();
        if(!currentRoom || !myTeam) return alert("请填写完整！");

        db.ref(`rooms/${currentRoom}/teams/${myTeam}`).once('value').then(snapshot => {
            if (snapshot.exists()) {
                alert("⚠️ 这个组别名称已经被其他队伍使用了，请换一个名称！");
                return;
            }

            // 【关键修改点：从外部的 gameData 获取角色列表】
            let randomRole = gameData.roles[Math.floor(Math.random() * gameData.roles.length)];
            myStats.awareness = randomRole.initAwareness;
            myStats.tolerance = randomRole.initCompassion;
            myStats.roleName = randomRole.name;
            myStats.compassion = 0; 
            myStats.reality = 0; 

            db.ref(`rooms/${currentRoom}/teams/${myTeam}`).set(myStats);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            db.ref(`rooms/${currentRoom}/currentStage`).on('value', (snapshot) => {
                let stage = snapshot.val();
                document.getElementById('my-stats').style.display = 'flex';
                document.getElementById('ui-role').innerText = myStats.roleName;
                document.getElementById('ui-reality').innerText = myStats.reality;
                document.getElementById('ui-awareness').innerText = myStats.awareness;
                document.getElementById('ui-tolerance').innerText = myStats.tolerance;
                
                // 【关键修改点：判断 stage 是否在新的 levels 数组中】
                let stageData = gameData.levels.find(l => l.id.toString() === stage);
                
                if (!stage || (!stage.includes("leaderboard") && stageData)) {
                    document.getElementById('corner-lotus').style.display = 'flex';
                    updateLotus(myStats.compassion); 
                }

                if (stage === "leaderboard_partial") {
                    renderLeaderboard(false);
                } else if (stage === "leaderboard_full") {
                    renderLeaderboard(true);
                } else if (stage && stageData) {
                    renderStage(stageData);
                } else {
                    document.getElementById('stage-title').innerText = "游戏暂未开始";
                    document.getElementById('stage-desc').innerText = "请留意大屏幕指示。";
                    document.getElementById('options-container').innerHTML = "";
                }
            });
        });
    }

    function renderStage(stageData) {
        document.getElementById('stage-title').innerText = stageData.title;
        document.getElementById('stage-desc').innerText = stageData.scenario; // 使用新格式的 scenario
        let container = document.getElementById('options-container');
        container.innerHTML = "";

        stageData.options.forEach(opt => {
            let btn = document.createElement('button');
            
            // 使用新格式的 requirements
            let req_awareness = opt.requirements ? opt.requirements.awareness : 0;
            let req_tolerance = opt.requirements ? opt.requirements.compassion : 0;

            let isAwarenessLocked = req_awareness > 0 && myStats.awareness < req_awareness;
            let isToleranceLocked = req_tolerance > 0 && myStats.tolerance < req_tolerance;
            let hasRequirement = req_awareness > 0 || req_tolerance > 0; 

            if (isAwarenessLocked || isToleranceLocked) {
                btn.disabled = true;
                btn.className = "locked";
                btn.innerHTML = `<span style="font-size:1em; font-weight:bold; color:var(--accent);">🔒 属性不足 (需觉察≥${req_awareness} 包容≥${req_tolerance})</span><br><br>${opt.action}`;
            } else {
                if (hasRequirement) {
                    btn.innerHTML = `<span style="font-size:1em; font-weight:bold; color:#4ade80;">🔓 成功解锁 (需觉察≥${req_awareness} 包容≥${req_tolerance})</span><br><br>${opt.action}`;
                } else {
                    btn.innerText = opt.action;
                }
                btn.onclick = () => submitChoice(opt);
            }
            container.appendChild(btn);
        });
    }

    function submitChoice(opt) {
        myStats.reality += opt.traffic; // 使用新格式的 traffic
        myStats.compassion += opt.compassionScore; // 使用新格式的 compassionScore
        myStats.awareness += opt.awareness;
        myStats.tolerance += opt.compassion; // 新格式中包容力字段名为 compassion

        db.ref(`rooms/${currentRoom}/teams/${myTeam}`).update(myStats);
        document.getElementById('options-container').innerHTML = "<div style='text-align:center; color:#888; padding: 20px; font-size: 1.1em;'>已作出选择，请等待其他队伍...</div>";

        document.getElementById('modal-text').innerText = opt.consequence;
        let rChange = opt.traffic >= 0 ? `+${opt.traffic}` : opt.traffic;
        document.getElementById('modal-reality').innerText = rChange;
        document.getElementById('modal-reality').style.color = opt.traffic >= 0 ? '#4ade80' : '#f87171';
        document.getElementById('modal').style.display = 'flex';
        
        document.getElementById('ui-reality').innerText = myStats.reality;
        document.getElementById('ui-awareness').innerText = myStats.awareness;
        document.getElementById('ui-tolerance').innerText = myStats.tolerance;
        
        updateLotus(myStats.compassion);
    }

    function renderLeaderboard(isFull) {
        document.getElementById('corner-lotus').style.display = 'none';
        
        document.getElementById('stage-title').innerText = isFull ? "🚨 终局排行榜：隐藏属性大揭晓" : "📊 中场排行榜";
        document.getElementById('stage-desc').innerText = isFull ? "（不再进行排名，仅展示各队伍的最终数值）" : "查看各队伍目前的进度表现。";
        
        db.ref(`rooms/${currentRoom}/teams`).once('value').then(snapshot => {
            let data = snapshot.val();
            let teamsArray = Object.keys(data).map(k => ({name: k, ...data[k]}));
            teamsArray.sort((a,b) => b.reality - a.reality);

            let tableHtml = `<table class="leaderboard-table"><tr><th>队伍</th><th>流量</th>`;
            if(isFull) tableHtml += `<th style="color:var(--accent)">慈心分</th><th>觉察力</th><th>包容力</th>`;
            tableHtml += `</tr>`;

            teamsArray.forEach((t, index) => {
                let rankIcon = "";
                
                if (!isFull) {
                    if (index === 0) rankIcon = `<span style="font-size:1.3em;">🥇</span> `;
                    else if (index === 1) rankIcon = `<span style="font-size:1.3em;">🥈</span> `;
                    else if (index === 2) rankIcon = `<span style="font-size:1.3em;">🥉</span> `;
                    else rankIcon = `<span style="color:#ffffff; font-size:1.2em; font-weight:bold; margin-right:8px;">${index + 1}.</span>`;
                }

                tableHtml += `<tr>
                    <td style="font-size:1.1em;">${rankIcon}<strong>${t.name}</strong><br><span style="font-size:0.8em; color:#888">${t.roleName}</span></td>
                    <td style="color:#4ade80; font-size:1.4em; font-weight:bold;">${t.reality}</td>`;
                
                if(isFull) {
                    tableHtml += `
                    <td style="color:var(--accent); font-size:1.4em; font-weight:bold;">${t.compassion}</td>
                    <td style="color:#e0e0e0; font-size:1.2em; font-weight:bold; text-align:center;">${t.awareness}</td>
                    <td style="color:#e0e0e0; font-size:1.2em; font-weight:bold; text-align:center;">${t.tolerance}</td>`;
                }
                tableHtml += `</tr>`;
            });
            tableHtml += `</table>`;
            document.getElementById('options-container').innerHTML = tableHtml;
        });
    }
</script>
</body>
</html>
